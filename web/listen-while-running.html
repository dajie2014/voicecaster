<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>边跑边听</title>
<style>
  body { margin:0; background:#0d0d12; color:#ecedf1;
         font:17px/1.7 -apple-system,"PingFang SC",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#8a8a94; font-size:14px; margin-bottom:20px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 4px;
         border-bottom:1px solid rgba(255,255,255,.07); }
  .no { width:76px; color:#c9c9d3; flex:none; }
  .sec { width:60px; color:#8a8a94; font-size:14px; flex:none; text-align:right; }
  .when { width:64px; color:#6f6f79; font-size:13px; flex:none; text-align:right; }
  audio { flex:1; height:34px; min-width:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>边跑边听</h1>
  <div class="sub" id="sub">正在看有哪些页已经生成好了…</div>
  <div id="list"></div>
</div>
<script>
const name = new URLSearchParams(location.search).get('name') || '';
const base = '/api/audio/output/ppt/' + encodeURIComponent(name) + '/audio/';
const list = document.getElementById('list');
const sub  = document.getElementById('sub');
let count = 0, miss = 0;

function row(no, ext, when){
  const el = document.createElement('div');
  el.className = 'row';
  const hhmm = when ? new Date(when).toLocaleTimeString('zh-CN',
      {hour:'2-digit', minute:'2-digit'}) : '';
  el.innerHTML = `<span class="no">第 ${no} 页</span>`
               + `<span class="when">${hhmm}</span>`;
  const a = document.createElement('audio');
  a.controls = true;
  a.preload = 'metadata';        // 只载时长，不预下载整段
  a.src = base + String(no).padStart(3,'0') + '.' + ext + '?t=' + Date.now();
  a.onloadedmetadata = () => {
    const s = document.createElement('span');
    s.className = 'sec';
    s.textContent = Math.round(a.duration) + ' 秒';
    el.appendChild(s);
  };
  el.appendChild(a);
  list.appendChild(el);
}

(async () => {
  if(!name){ sub.textContent = '地址里少了课件名：在后面加上 ?name=课件名'; return; }
  for(let i = 1; i <= 80; i++){
    let got = null, when = null;
    for(const ext of ['mp3','m4a','wav']){
      try{
        // 注意：这个服务对 HEAD 一律 404，只能用 Range 要 1 个字节来探
        const r = await fetch(base + String(i).padStart(3,'0') + '.' + ext,
                              {headers:{'Range':'bytes=0-0'}});
        if(r.ok || r.status === 206){ got = ext; when = r.headers.get('Last-Modified'); break; }
      }catch(e){}
    }
    if(got){
      miss = 0; count++;
      row(i, got, when);
    }else{
      if(++miss >= 3) break;        // 连着三页没有，后面就还没做
    }
  }
  sub.textContent = name + ' · 现在有 ' + count + ' 页可以听（右边是生成时间）。' +
    '重跑时旧页还在、会被一页页覆盖 —— 看时间分辨新旧；刷新一下就是最新的。';
})();
</script>
</body>
</html>
